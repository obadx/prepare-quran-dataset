# main docs of setup tools: https://setuptools.pypa.io/en/latest/userguide/quickstart.html
# pypip tutoral: https://packaging.python.org/en/latest/tutorials/packaging-projects/
# Video Tutorial: https://www.youtube.com/watch?v=v6tALyc4C10
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
include-package-data = true # to include data directories

[project]
name = "prepare-quran-dataset"
version = "2.0.0"
authors = [
  { name="Quran Muaalem Team", email="quran.muaalem@gmail.com" },
]
description = "Downloading and Processing Quran Recitaion of the Holy Quran"
readme = "README.md"
dependencies = [
  "pypdl==1.4.4",
  "tqdm",
  "pydantic",
  "datasets[audio]==5.0.1",
  "pyarrow>=20.0.0",
  "mutagen==1.47.0",
  "quran-transcript==0.6.1",
  "beautifulsoup4==4.12.3",
  "filetype==1.2.0",
  "ruamel.yaml==0.18.6", # It has duplicate key validation in a dict structure
  "huggingface_hub",
  "pyyaml",
  "numpy>=2.4.6",
  "matplotlib>=3.11.0",
]
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Optional dependencies
[tool.pytest.ini_options]
testpaths = [
  "tests/test_fastconformer_mask_golden.py",
  "tests/test_ctc_decoding.py",
  "tests/test_streaming_processor.py",
]
# The package cannot be pip-installed where python < 3.14 (see requires-python), so
# pytest would not find `prepare_quran_dataset` at all. "." also puts train_streaming
# in reach, which un-skips the canonical-decoder comparison.
pythonpath = ["src", "."]

[project.optional-dependencies]

test = [
  "pytest",
]

annotate = [
  "openai==1.82.0",
  "librosa==0.11.0",
  "soundfile",
  "torch>=2.12.0",
  "torchaudio",
  "recitations-segmenter==1.0.0",
  "transformers>=5.9.0",
  "submitit==1.5.3",
  "stamina",
  "protobuf==6.31.1",
  "phonemizer",
  "wandb",
  "python-dotenv",
  "plotly",
  "audiomentations>=0.43.1",
  "Levenshtein>=0.27.1",
  "accelerate>=1.13",
  "pyroomacoustics>=0.10.1",
  "fast_mp3_augment",
  "tensorboard",
  "qdat-bench",
]

test_streaming = [
  "gradio>=6.20.0",
  "soxr", # the mic app's stateful chunk resampler; was relied on transitively via librosa
]
litert = [
    "ai-edge-litert>=2.1.5",
    "ai-edge-quantizer>=0.7.0",
    "litert-torch>=0.9.1",
]
nemo = [
    "nemo-toolkit[asr]>=2.1.0",
    "pytorch-lightning>=2.6.5",
]
ui = [
    "gradio>=6.20.0",
    "streamlit>=1.63.0",
]


[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch"]

# Solving installtion of litert
[tool.uv]
override-dependencies = ["xdsl>=0.40"]

[tool.uv.sources]
qdat-bench = { git = "https://github.com/obadx/qdat_bench.git" }

[project.urls]
Homepage = "https://github.com/obadx/prepare-quran-dataset"
Issues = "https://github.com/obadx/prepare-quran-dataset/issues"

# # for addint data: https://setuptools.pypa.io/en/latest/userguide/datafiles.html#package-data
[tool.setuptools.package-data]
quran_transcript = ["data/*"]
